title: Berkeley eXtensible Environment
description: LBNL-hosted, FPGA-based Computer Architecture Simulation Environment
theme: just-the-docs
baseurl: ""
url: "https://lbnlbxe.github.io"

github_repo: "https://github.com/lbnlbxe/bxe"

# color_scheme: lbnl-dark
color_scheme: lbnl-light

logo: "assets/logos/project-logo.png"
favicon_ico: "/assets/favicon/favicon.ico"

search_enabled: false
heading_anchors: true
enable_copy_code_button: true

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%Y %b %e at %H:%M %z" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

aux_links:
  "BXE on GitHub": https://github.com/lbnlbxe/bxe
aux_links_new_tab: true

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# GitHub Pages supported plugins (automatically enabled with github-pages gem)
plugins:
  - jekyll-email-protect
  # - jekyll-feed
  # - jekyll-sitemap
  # - jekyll-seo-tag


mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
  version: "11.16.0"

