title: Berkeley eXtensible Environment
description: LBNL-hosted, FPGA-based Computer Architecture Simulation Environment
baseurl: "bxe"
url: "https://lbnlcomputerarch.github.io/"

markdown: kramdown
highlighter: rouge
permalink: pretty

# GitHub Pages supported plugins (automatically enabled with github-pages gem)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

include: ['pages']

defaults:
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/
  - node_modules/
  - templates/
  